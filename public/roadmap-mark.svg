<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Roadmap — marcos conectados</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2=".22" y2="1">
      <stop offset="0" stop-color="#00EBE6"/>
      <stop offset=".50" stop-color="#02C7FB"/>
      <stop offset="1" stop-color="#087FF6"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253D5A"/>
      <stop offset=".55" stop-color="#14253E"/>
      <stop offset="1" stop-color="#0B172D"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2877E8"/>
      <stop offset=".5" stop-color="#18A6FF"/>
      <stop offset="1" stop-color="#55D5FF"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#24DFA4"/>
      <stop offset="1" stop-color="#6AFFC4"/>
    </linearGradient>
  </defs>
  <!-- Timeline, behind the milestones -->
  <path d="M 194,353 C 226,299 263,318 290,281 C 313,251 334,226 343,188" fill="none" stroke="url(#route)" stroke-width="32" stroke-linecap="round"/>
  <!-- Upper/right milestone and its unmistakable bright peel on the left -->
  <rect x="288" y="45" width="179" height="184" rx="44" fill="url(#edge)"/>
  <rect x="328" y="45" width="139" height="184" rx="44" fill="url(#front)" stroke="#38516D" stroke-width="2"/>
  <!-- Lower/left milestone, completed -->
  <rect x="43" y="284" width="198" height="197" rx="47" fill="url(#edge)"/>
  <rect x="85" y="284" width="156" height="197" rx="46" fill="url(#front)" stroke="#38516D" stroke-width="2"/>
  <path d="M 122,387 L 151,417 L 209,357" fill="none" stroke="url(#check)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>